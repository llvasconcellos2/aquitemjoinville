    <title>Segmentos de Anunciantes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Tahoma, Verdana, Arial, sans-serif;
        font-size: 11px;
      }

      .widget {
        width: 164px;
        height: 278px;
        position: relative;
        overflow: hidden;
        background: #fff;
        border: 1px solid #7f9db9;
      }

      .list-scroll {
        position: absolute;
        inset: 0;
        overflow-y: scroll;
        scrollbar-width: none;
      }
      .list-scroll::-webkit-scrollbar {
        display: none;
      }

      ul {
        list-style: none;
        padding-right: 13px;
      }

      li {
        padding: 3px 3px;
        cursor: default;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 15px;
        user-select: none;
      }
      li:hover {
        background: #cce5ff;
      }
      li.selected {
        background: #316ac5;
        color: #fff;
      }

      .scrollbar {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 13px;
        cursor: pointer;
      }
      .scrollbar::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #aaa;
        transform: translateX(-50%);
      }
      .scrollbar-thumb {
        position: absolute;
        left: 0;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at 50% 28%,
          #ffdd77,
          #ff8800 55%,
          #cc4400
        );
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>

        return str
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");

      var list = document.getElementById("segmentList");
      tipos.forEach(function (tipo) {
        var li = document.createElement("li");
        li.textContent = tipo;
        li.onclick = function () {
          var prev = list.querySelector("li.selected");
          if (prev) prev.classList.remove("selected");
          li.classList.add("selected");
          navigateToSegmento(tipo);
        };
        list.appendChild(li);
      });

      var scroll = document.getElementById("listScroll");
      var thumb = document.getElementById("scrollThumb");
      var bar = document.getElementById("scrollbar");

      function updateThumb() {
        var maxScroll = scroll.scrollHeight - scroll.clientHeight;
        if (maxScroll <= 0) {
          thumb.style.display = "none";
          return;
        }
        thumb.style.display = "block";
        var ratio = scroll.scrollTop / maxScroll;
        var trackH = bar.clientHeight;
        var thumbH = thumb.offsetHeight;
        var top = ratio * (trackH - thumbH);
        thumb.style.top = Math.max(0, Math.min(trackH - thumbH, top)) + "px";
      }

      scroll.addEventListener("scroll", updateThumb);
      window.addEventListener("load", updateThumb);
      updateThumb();

      bar.addEventListener("click", function (e) {
        var rect = bar.getBoundingClientRect();
        var ratio = (e.clientY - rect.top) / rect.height;
        scroll.scrollTop = ratio * (scroll.scrollHeight - scroll.clientHeight);
      });
    </script>
